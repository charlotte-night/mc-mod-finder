# Publishes the static browser build to GitHub Pages.
#
# The site needs no build step, no npm install and no secrets: `web/` is already a working
# static site. This workflow only checks it and uploads it.
#
# One-time setup in the repository: Settings -> Pages -> Build and deployment -> Source =
# "GitHub Actions". After that, every push to the default branch republishes the site.

name: Deploy web to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'web/**'
      - 'test/web-*'
      - 'scripts/serve-web.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; never cancel one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unit tests (scoring, cache, limiters)
        run: node test/web-lib.test.js
      - name: Static-site tests (assets, module graph, DOM contract)
        run: node test/web-site.test.js

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # the published site is exactly this folder
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
