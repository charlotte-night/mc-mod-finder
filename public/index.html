<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MC Mod Finder · 我的世界模组/整合包搜索与推荐</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23343026'/><rect x='6' y='6' width='9' height='9' fill='%237bd14a'/><rect x='17' y='6' width='9' height='9' fill='%23e0a83c'/><rect x='6' y='17' width='9' height='9' fill='%235ac8e0'/><rect x='17' y='17' width='9' height='9' fill='%23d25a4a'/></svg>" />
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>MC Mod Finder</h1>
        <p class="tagline">按名称 / 版本 / 类型搜索模组与整合包，并根据<b>实测下载速度</b>与<b>是否免费</b>给出推荐</p>
      </div>
    </div>
    <div id="sourceStatus" class="source-status" aria-live="polite"></div>
  </header>

  <main>
    <form id="searchForm" class="panel search-panel" autocomplete="off">
      <div class="search-row">
        <input id="query" type="search" name="q" placeholder="输入名称，例如 JEI、Create、钠、暮色森林、ATM10…" aria-label="搜索名称" />
        <button type="submit" class="primary">搜索</button>
      </div>

      <div class="filters">
        <label class="field">
          <span>类型</span>
          <select id="type" name="type">
            <option value="all">全部</option>
            <option value="mod" selected>模组</option>
            <option value="modpack">整合包</option>
            <option value="resourcepack">资源包</option>
            <option value="shader">光影</option>
            <option value="datapack">数据包</option>
          </select>
        </label>

        <label class="field">
          <span>游戏版本</span>
          <select id="version" name="version">
            <option value="">不限</option>
          </select>
        </label>

        <label class="field">
          <span>加载器</span>
          <select id="loader" name="loader">
            <option value="">不限</option>
          </select>
        </label>

        <label class="field">
          <span>排序</span>
          <select id="sort" name="sort">
            <option value="score" selected>推荐分（综合）</option>
            <option value="speed">下载速度优先</option>
            <option value="free">免费程度优先</option>
            <option value="downloads">下载量</option>
            <option value="followers">关注数</option>
            <option value="updated">最近更新</option>
            <option value="relevance">名称相关度</option>
          </select>
        </label>

        <label class="field checkbox">
          <input id="freeOnly" type="checkbox" />
          <span>只看可直接下载的免费资源</span>
        </label>
      </div>

      <div class="ext-links">
        <span class="ext-label">在其它站点搜索：</span>
        <span id="extLinks"></span>
      </div>

      <details id="weightsBox" class="weights">
        <summary>推荐权重（速度 {{speed}}% · 免费 {{free}}%）— 点击调整</summary>
        <div class="weights-grid" id="weightsGrid"></div>
        <div class="weights-actions">
          <button type="button" id="resetWeights" class="ghost">恢复默认权重</button>
          <span class="hint">权重会自动归一化。调整后立即重新排序。</span>
        </div>
      </details>
    </form>

    <details id="cfPanel" class="panel cf-panel" hidden>
      <summary id="cfSummary">CurseForge 按数字 ID 查询</summary>
      <div class="cf-row">
        <input id="cfId" type="text" placeholder="数字项目 ID，例如 238222（JEI）、462042（整合包）" aria-label="CurseForge 项目 ID" />
        <button type="button" id="cfBtn" class="primary">查询</button>
      </div>
      <p class="hint" id="cfHint"></p>
      <div id="cfResult"></div>
    </details>

    <section class="panel toolbar" id="toolbar" hidden>
      <div class="toolbar-left">
        <span id="resultCount" class="count"></span>
        <span id="tookMs" class="muted"></span>
      </div>
      <div class="toolbar-right">
        <label class="inline-field">
          <span>测速数量</span>
          <input id="speedLimit" type="number" min="1" max="16" value="8" />
        </label>
        <button type="button" id="speedBtn" class="primary">为推荐测速</button>
      </div>
    </section>

    <section id="reports" class="reports" hidden></section>
    <section id="status" class="status" hidden></section>
    <section id="results" class="results"></section>
    <section id="empty" class="empty" hidden></section>
  </main>

  <footer class="footer">
    <p>
      数据来自各平台公开 API。测速为真实分块下载采样（排除首字节延迟），结果按 CDN 主机缓存 10 分钟。
      <span id="footerNote"></span>
    </p>
  </footer>

  <script type="module" src="/app.js"></script>
</body>

</html>
